<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科信小助手 · 版本清单</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 40px 20px; background: #f5f6f8; color: #1b1f24;
         font: 15px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 14px;
         padding: 26px 24px; box-shadow: 0 1px 3px rgba(20,30,50,.08); }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p.lead { margin: 0 0 20px; color: #6b7280; font-size: 13px; }
  code { background: #f1f3f6; border-radius: 6px; padding: 2px 6px; font-size: 13px; }
  ol { padding-left: 20px; margin: 12px 0 0; }
  li { margin: 6px 0; }
  footer { margin-top: 22px; padding-top: 16px; border-top: 1px solid #eceef2;
           color: #6b7280; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>科信小助手 · 版本清单</h1>
  <p class="lead">这是应用启动时读取的文件，不是给人看的页面。地址：<code>update.json</code></p>
  <ol>
    <li>版本号与版本代码，用来判断是否比手机上的新；</li>
    <li>这一版的更新说明，原样显示在应用内的更新公告里；</li>
    <li>安装包的 HTTPS 地址、字节数与 SHA-256，下载后逐项核对。</li>
  </ol>
  <footer>清单内容只有应用读取；此页面仅用于确认地址可达。</footer>
</main>
</body>
</html>
